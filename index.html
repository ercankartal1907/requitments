<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="darkreader-lock">
<title>Dijital Okul</title>
<script>document.documentElement.dataset.theme=localStorage.th||"light"</script>
<style>
:root{--bg:#f6f7fb;--sf:#fff;--sf2:#eef0f7;--tx:#0f172a;--mu:#64748b;--bd:#e2e8f0;--pr:#4f46e5;--prx:#4338ca;--ok:#16a34a;--dn:#dc2626;--sh:0 1px 2px rgba(15,23,42,.06),0 6px 18px rgba(15,23,42,.06);color-scheme:light}
[data-theme=dark]{--bg:#0b1020;--sf:#131a2e;--sf2:#1b2440;--tx:#e8ecf8;--mu:#94a3b8;--bd:#26304f;--pr:#6366f1;--prx:#a5b4fc;--sh:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx)}
h1{font-size:26px;margin:0;line-height:1.2}
h2{margin:0 0 4px;font-size:24px}
h3{margin:0 0 8px;font-size:16px}
p{margin:6px 0}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{padding:9px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--sf);outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--pr);box-shadow:0 0 0 3px color-mix(in srgb,var(--pr) 22%,transparent)}
textarea{resize:vertical;min-height:70px}
button{cursor:pointer;border:0}
.btn{background:var(--pr);color:#fff;padding:9px 16px;border-radius:10px;font-weight:600;transition:.15s}
.btn:hover{filter:brightness(1.1)}
.btn.sec{background:var(--sf2);color:var(--tx)}
.btn.dn{background:var(--dn);color:#fff}
.btn.sm{padding:5px 11px;font-size:13px}
.btn.lg{padding:12px 22px;font-size:16px}
.btn:disabled,.ic:disabled,.cb:disabled{opacity:.4;cursor:default}
.ic{background:var(--sf2);color:var(--tx);width:34px;height:34px;border-radius:9px;display:inline-grid;place-items:center;font-size:15px;padding:0;flex:none}
.ic:hover{filter:brightness(.95)}
.ic.on{background:var(--pr);color:#fff}
.mu,small{color:var(--mu)}
small{display:block;font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.err{color:var(--dn);min-height:20px}
.chip,.tag{display:inline-block;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--pr) 14%,transparent);color:var(--prx);border-radius:99px;padding:2px 10px}
.chip.big{font-size:18px;letter-spacing:3px;padding:6px 14px;cursor:pointer}
.sh2{margin:22px 0 10px}
.sub{background:var(--sf2);border-radius:12px;padding:12px;margin-top:10px}
.form{display:flex;flex-direction:column;gap:10px;margin-top:12px}
summary{cursor:pointer}
.empty{grid-column:1/-1;text-align:center;padding:50px;color:var(--mu);font-size:40px}
.empty p{font-size:15px;margin:6px 0 0}
#shell{display:flex;min-height:100%}
#side{width:240px;flex:none;background:var(--sf);border-right:1px solid var(--bd);padding:18px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
#shell.out #side{display:none}
.logo{display:flex;gap:10px;align-items:center;font-size:18px;padding:0 8px}
.logo span{font-size:24px}
nav{display:flex;flex-direction:column;gap:4px;flex:1}
.ni{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:none;color:var(--mu);font-weight:600;text-align:left}
.ni:hover{background:var(--sf2)}
.ni.on{background:color-mix(in srgb,var(--pr) 14%,transparent);color:var(--prx)}
.ni span{font-size:18px}
.ni em{font-style:normal}
.who{display:flex;gap:8px;align-items:center;padding-top:14px;border-top:1px solid var(--bd)}
.wn{flex:1;min-width:0}
.wn b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--pr),#ec4899);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.av.sm{width:28px;height:28px;font-size:13px}
#main{flex:1;min-width:0}
#app{max-width:1080px;margin:0 auto;padding:28px 24px 60px}
#shell.out #app{max-width:none;padding:0}
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.hero{background:linear-gradient(135deg,#4f46e5,#7c3aed 55%,#ec4899);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.hero h1{font-size:38px;line-height:1.15}
.hero p{opacity:.92;font-size:17px;max-width:420px}
.logo.big{padding:0;font-size:22px}
.panel{display:flex;flex-direction:column;gap:14px;justify-content:center;padding:48px;max-width:460px;width:100%;margin:0 auto}
.panel label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
.sw2{text-align:center;color:var(--mu)}
.sw2 a{color:var(--prx);cursor:pointer;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.stat{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:16px;box-shadow:var(--sh);display:grid;gap:2px}
.stat span{font-size:22px}
.stat b{font-size:28px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;cursor:pointer}
.li:hover{background:var(--sf2)}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px}
.book{position:relative;background:var(--sf);border:1px solid var(--bd);border-radius:14px;overflow:hidden;box-shadow:var(--sh);transition:.15s}
.book:hover{transform:translateY(-3px)}
.cv{aspect-ratio:3/4;background:linear-gradient(135deg,var(--sf2),var(--bd));cursor:pointer;position:relative}
.cv img{width:100%;height:100%;object-fit:cover;display:block;background:#fff}
.cv img:not([src]){visibility:hidden}
.pg{position:absolute;right:8px;bottom:8px;background:rgba(15,23,42,.75);color:#fff;font-size:11px;padding:2px 8px;border-radius:99px}
.cv .tag{position:absolute;left:8px;top:8px;background:#fff;color:#4338ca}
.bi{padding:10px 12px}
.bi b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bi small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl{position:absolute;right:6px;top:6px;opacity:0;background:rgba(255,255,255,.95);color:#111}
.book:hover .dl{opacity:1}
.srch{width:240px}
.chk{display:flex;gap:6px;align-items:center;font-size:14px}
.center{text-align:center;max-width:520px;margin:30px auto}
.code{text-transform:uppercase;letter-spacing:8px;text-align:center;font-size:22px;font-weight:700;width:210px}
.cj{justify-content:center;margin:14px 0}
#toasts{position:fixed;right:16px;top:16px;z-index:100;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;box-shadow:var(--sh);font-weight:600}
.toast.ok{background:var(--ok);color:#fff}
.toast.bad{background:var(--dn);color:#fff}
#reader{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
#rh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 14px;background:var(--sf);border-bottom:1px solid var(--bd)}
.rt{max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp{display:flex;gap:6px;align-items:center;background:var(--sf2);padding:4px 8px;border-radius:12px}
#pnum{width:58px;text-align:center;padding:4px}
.vr{width:1px;height:22px;background:var(--bd)}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--sf);box-shadow:0 0 0 1px var(--bd);padding:0}
.sw.on{box-shadow:0 0 0 2px var(--pr)}
#color{padding:0;width:28px;height:28px;border:0;background:none}
#size{width:90px;padding:0;accent-color:var(--pr)}
#reader.ro .edit{display:none}
#wrap{flex:1;overflow:auto;text-align:center;padding:18px;background:var(--sf2)}
#stage{position:relative;display:inline-block}
#stage canvas{display:block;background:#fff;box-shadow:0 4px 24px rgba(0,0,0,.25);border-radius:4px}
#drawc{position:absolute;left:0;top:0;touch-action:none;background:transparent!important}
#live{position:fixed;inset:0;z-index:60;background:#0b1020;color:#e8ecf8;display:flex;flex-direction:column}
#live.min{display:none}
#lrest{position:fixed;right:16px;bottom:16px;z-index:61}
#lrest[hidden]{display:none}
#lh{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid #1e2745;flex-wrap:wrap}
#lh .mu{color:#94a3b8;font-size:13px}
#lmain{flex:1;display:flex;min-height:0}
#boardw{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding:14px;min-width:0}
#board{width:100%;max-width:calc((100vh - 200px)*16/9);height:auto;background:#fff;border-radius:10px;box-shadow:0 8px 40px rgba(0,0,0,.5);touch-action:none}
#btools{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:rgba(19,26,46,.95);border:1px solid #26304f;padding:6px 10px;border-radius:14px}
#btools .ic{background:#1b2440;color:#e8ecf8}
#btools .ic.on{background:#6366f1}
#bcol{padding:0;width:28px;height:28px;border:0;background:none}
#bsz{width:80px;padding:0;accent-color:#6366f1}
#rside{width:290px;flex:none;display:flex;flex-direction:column;border-left:1px solid #1e2745}
#vids{max-height:48%;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px}
.tile{position:relative;background:#000;border-radius:10px;overflow:hidden}
.tile video{width:100%;display:block;aspect-ratio:4/3;object-fit:cover}
.tile span{position:absolute;left:5px;bottom:4px;font-size:11px;background:rgba(0,0,0,.65);padding:1px 6px;border-radius:6px}
#tabs{display:flex;border-bottom:1px solid #1e2745}
#tabs button{flex:1;background:none;color:#94a3b8;padding:10px;font-weight:600}
#tabs button.on{color:#fff;box-shadow:inset 0 -2px #6366f1}
#pchat,#pppl{flex:1;min-height:0;display:flex;flex-direction:column}
#clog{flex:1;overflow:auto;padding:10px;font-size:13px;display:flex;flex-direction:column;gap:6px}
#clog b{color:#a5b4fc}
#pchat input{background:#131a2e;border-color:#26304f;color:#e8ecf8}
#pppl{overflow:auto;padding:8px;gap:4px}
.pp{display:flex;gap:8px;align-items:center;padding:6px}
#lf{display:flex;justify-content:center;gap:12px;padding:12px;border-top:1px solid #1e2745;flex-wrap:wrap}
.cb{background:#1b2440;color:#e8ecf8;border-radius:14px;padding:8px 16px;display:flex;flex-direction:column;align-items:center;min-width:80px}
.cb span{font-size:20px}
.cb em{font-style:normal;font-size:11px;color:#94a3b8}
.cb.off{background:#7f1d1d}
.cb.on{background:#6366f1}
.cb.dn{background:#dc2626}
.cb.on em,.cb.dn em,.cb.off em{color:#fff}
[hidden]{display:none!important}
@media(max-width:780px){
#shell{flex-direction:column}
#side{position:fixed;bottom:0;left:0;right:0;top:auto;width:100%;height:auto;flex-direction:row;padding:6px;z-index:30;border-right:0;border-top:1px solid var(--bd);gap:4px}
.logo,.wn{display:none}
nav{flex-direction:row;justify-content:space-around}
.ni{flex-direction:column;gap:0;padding:6px 10px;font-size:11px}
.who{border:0;padding:0}
#app{padding:18px 14px 90px}
.stats{grid-template-columns:repeat(2,1fr)}
.two,.auth{grid-template-columns:1fr}
.hero{padding:28px}
.panel{padding:24px}
#lmain{flex-direction:column}
#rside{width:100%;height:42%;border-left:0;border-top:1px solid #1e2745}
#board{max-width:100%}
}

.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap;vertical-align:top}
.tbl th{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.tw{overflow-x:auto}
.up{color:var(--ok);font-weight:700}.dw{color:var(--dn);font-weight:700}
.fl{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:14px}
.bar{height:10px;background:var(--sf2);border-radius:99px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--pr);border-radius:99px}
.score{font-size:56px;font-weight:800;line-height:1}
.pre{white-space:pre-wrap}
.tabs2{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs2 button{padding:8px 14px;border-radius:10px;background:var(--sf2);color:var(--tx);font-weight:600}
.tabs2 button.on{background:var(--pr);color:#fff}
.opt{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;cursor:pointer;margin-top:8px;background:var(--sf)}
.opt.on{border-color:var(--pr);background:color-mix(in srgb,var(--pr) 12%,transparent)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.opt.bad{border-color:var(--dn);background:color-mix(in srgb,var(--dn) 12%,transparent)}
#exam{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column}
.exh{display:flex;gap:12px;align-items:center;padding:10px 16px;background:var(--sf);border-bottom:1px solid var(--bd);flex-wrap:wrap}
.exb{flex:1;overflow:auto;padding:18px;max-width:820px;width:100%;margin:0 auto}
.eban{background:#fef3c7;color:#92400e;padding:8px 16px;font-weight:600}
#pick{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:16px}
#pick .pk{max-width:480px;width:100%;max-height:80vh;overflow:auto;margin:0}
textarea{min-height:70px}
@media(max-width:780px){.ni{padding:6px 5px;font-size:10px}}
#nb{position:fixed;inset:0;z-index:90;background:#1e293b;display:flex;flex-direction:column}
#nb[hidden]{display:none}
.nbt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px;background:#0f172a;color:#fff}
#nbw{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;padding:12px;min-height:0}
#nbc2{background:#fff;max-width:100%;max-height:100%;width:auto;height:auto;touch-action:none}
body.hc{filter:contrast(1.3)}
.hc .card{border:2px solid #000}

@import url("https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600;7..72,700&display=swap");
:root{--paper:#F6F4EE;--card:#FFFDF8;--ink:#1C2430;--ink2:#465162;--ink3:#7A8494;--line:#DCD8CC;--pr:#1F4E79;--prx:#163A5A;--pencil:#E8B02E;--pencil-soft:#F5E7B8;--chalk:#1F3B33;--ok:#2E7D4F;--dn:#B42318;--sf:var(--card);--sf2:#EFEBE0;--bg:var(--paper);--tx:var(--ink);--mu:var(--ink3);--bd:var(--line);--sh:none;--pr-rgb:31,78,121}
body{font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.6;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
h1,h2,h3,.logo b,.hero h1,.stat b,.lc-title{font-family:Literata,Georgia,"Times New Roman",serif;letter-spacing:-.01em;color:var(--ink)}
h1{font-size:30px;font-weight:600;line-height:1.2}
h2{font-size:26px;font-weight:600}
h3{font-size:17px;font-weight:600}
.mu,small{color:var(--ink3)}
:focus-visible{outline:2px solid var(--pencil);outline-offset:2px}
#app{background-image:repeating-linear-gradient(to bottom,transparent 0 31px,rgba(var(--pr-rgb),.055) 31px 32px);background-attachment:local}
.hd{padding-bottom:14px;margin-bottom:22px;border-bottom:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:14px;box-shadow:none}
.card.pk,#pick .card{box-shadow:0 18px 48px rgba(28,36,48,.22)}
.btn{background:var(--pr);color:#fff;border-radius:10px;font-weight:600;letter-spacing:0;padding:9px 16px;transition:background-color .15s,color .15s}
.btn:hover{background:var(--prx);filter:none}
.btn.sec{background:transparent;color:var(--pr);box-shadow:inset 0 0 0 1px var(--line)}
.btn.sec:hover{background:var(--sf2);filter:none}
.btn.dn{background:var(--dn)}
.btn.dn:hover{background:#8F1A12}
.btn.sm{padding:6px 12px;font-size:13px}
input,select,textarea{border:1px solid var(--line);border-radius:10px;background:#FFFFFF;padding:9px 12px}
input:focus,select:focus,textarea:focus{border-color:var(--pr);box-shadow:0 0 0 3px rgba(var(--pr-rgb),.16)}
.ic{background:var(--sf2);color:var(--ink);border-radius:9px}
.ic.on{background:var(--pr);color:#fff}
.chip,.tag{background:var(--pencil-soft);color:#5C4300;border-radius:6px;font-weight:600;font-size:12px;padding:2px 9px}
.chip.dw{background:#F8DFDB;color:var(--dn)}
.chip.big{font-family:Literata,serif;font-size:20px;letter-spacing:4px;padding:6px 14px;background:var(--sf2);color:var(--ink)}
.sub{background:var(--sf2);border-radius:10px}
.stats{gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:none;padding:18px}
.stat span{font-size:20px}
.stat b{font-size:30px;font-weight:600}
.tbl th{color:var(--ink3);font-weight:600;font-size:13px;border-bottom:1px solid var(--line)}
.tbl td{border-bottom:1px solid #EFEBE0}
.li{border-radius:10px}
.li:hover{background:var(--sf2)}
.empty{font-family:Literata,serif;color:var(--ink3)}
.bar{background:#E7E2D4;border-radius:99px}
.bar i{background:var(--pr);border-radius:99px}
#side{background:var(--card);border-right:1px solid var(--line);padding:22px 16px}
.logo{padding:0 6px}
.logo span{font-size:26px}
.logo b{font-size:19px;font-weight:600}
.ni{color:var(--ink2);border-radius:10px;position:relative;font-weight:500}
.ni:hover{background:var(--sf2);color:var(--ink)}
.ni.on{background:transparent;color:var(--ink);font-weight:600}
.ni.on::before{content:"";position:absolute;left:-16px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--pencil)}
.who{border-top:1px solid var(--line)}
.av{background:var(--chalk);color:#F3F1EA;border-radius:8px;font-family:Literata,serif;font-weight:600}
.auth{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.hero{background:var(--chalk);color:#F3F1EA;padding:64px 56px;background-image:linear-gradient(rgba(243,241,234,.06) 1px,transparent 1px);background-size:100% 34px}
.hero h1{color:#F3F1EA;font-size:42px;line-height:1.12;font-weight:600;max-width:560px}
.hero p{color:rgba(243,241,234,.82);font-size:17px;max-width:460px}
.logo.big b{color:#F3F1EA;font-size:22px}
.panel{background:transparent;padding:56px 48px}
.panel h2{font-size:28px}
.sw2 a{color:var(--pr);text-decoration:underline;text-underline-offset:3px}
.books{gap:20px}
.book{border-radius:12px;border-color:var(--line);box-shadow:none}
.book:hover{transform:none;border-color:var(--ink3)}
.cv{background:var(--sf2)}
.cv .tag{background:var(--card);color:var(--pr)}
#live{background:var(--chalk)}
#lh,#lf{background:rgba(0,0,0,.18)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:820px){
#side{width:auto;height:auto;position:static;flex-direction:row;overflow-x:auto;padding:10px 12px;gap:10px}
.logo{display:none}
nav{flex-direction:row;gap:4px}
.ni.on::before{display:none}
.ni.on{background:var(--sf2)}
.who{display:none}
.hero{display:none}
.auth{grid-template-columns:1fr}
.panel{padding:32px 22px}
.stats{grid-template-columns:1fr 1fr}
#app{padding:20px 16px 48px}
}
</style>
</head>
<body>
<div id="shell"><aside id="side"></aside><main id="main"><div id="app"></div></main></div>
<div id="toasts"></div>
<div id="exam" hidden></div>
<div id="pick" hidden></div>
<div id="reader" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)]
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))
let token=localStorage.t,me=null,view="home",err="",mode="login"
const titles={}
const cache=bs=>bs.forEach(b=>titles[b.id]=b.title)
function toast(m,t="",ms=3200){
const e=document.createElement("div")
e.className="toast "+t
e.textContent=m
$("#toasts").appendChild(e)
if(ms)setTimeout(()=>e.remove(),ms)
return e
}
function copy(c){
(navigator.clipboard?navigator.clipboard.writeText(c):Promise.reject()).then(()=>toast("Kod kopyalandı","ok")).catch(()=>toast("Kod: "+c))
}
function theme(){
const d=document.documentElement
d.dataset.theme=d.dataset.theme=="dark"?"light":"dark"
localStorage.th=d.dataset.theme
}
async function api(p,o={}){
const h={...(token?{Authorization:"Bearer "+token}:{})}
let body=o.body
if(body&&!(body instanceof FormData)){h["Content-Type"]="application/json";body=JSON.stringify(body)}
const r=await fetch("/api"+p,{method:o.method||"GET",headers:h,body})
if(!r.ok){let m="Hata";try{const d=(await r.json()).detail;m=Array.isArray(d)?d.map(x=>x.msg).join(", "):(d||m)}catch{}throw new Error(m)}
return o.raw?r:r.json()
}
function nav(){
$("#shell").classList.toggle("out",!me)
if(!me)return
$("#side").innerHTML=`<div class="logo"><span>📖</span><b>Dijital Okul</b></div><nav>${navItems().map(([k,i,l])=>`<button class="ni ${view==k?"on":""}" onclick="go('${k}')"><span>${i}</span><em>${l}</em></button>`).join("")}</nav><div class="who"><div class="av">${esc((me.name||"?")[0]).toUpperCase()}</div><div class="wn"><b>${esc(me.name)}</b><small>${me.role=="teacher"?"Öğretmen":"Öğrenci"}</small></div><button class="ic" title="Tema" onclick="theme()">🌓</button><button class="ic" title="Çıkış" onclick="logout()">⎋</button></div>`
}
function go(v){view=v;err="";clearTimeout(exmT);render()}
function logout(){api("/logout",{method:"POST"}).catch(()=>{});localStorage.removeItem("t");token=null;me=null;view="home";render()}
function setMode(m){mode=m;err="";authView()}
async function auth(){
const f=Object.fromEntries(new FormData($("#af")))
try{
const r=await api(mode=="login"?"/login":"/register",{method:"POST",body:f})
token=r.token;localStorage.t=token;me=r.user;err="";view="home";render()
}catch(e){err=e.message;authView()}
}

const f=mode=="forgot"
$("#app").innerHTML=`<div class="auth"><div class="hero"><div class="logo big"><span>📖</span><b>Dijital Okul</b></div><h1>Şifreni sıfırla</h1><p>Doğrulama kodu okul sunucusunda oluşturulur. Kodu sunucu yöneticisinden iste.</p></div><form id="rf" class="panel" onsubmit="resetSubmit();return false"><h2>${f?"Şifre sıfırlama":"Yeni şifre"}</h2><label>E-posta<input name="email" type="email" required value="${esc(rEmail)}"></label>${f?"":`<label>Doğrulama kodu<input name="code" required inputmode="numeric" maxlength="6"></label><label>Yeni şifre<input name="password" type="password" required minlength="6"></label>`}<div class="err">${esc(err)}</div><button class="btn lg">${f?"Kod iste":"Şifreyi değiştir"}</button><p class="sw2"><a onclick="setMode('login')">Girişe dön</a>${f?"":` · <a onclick="setMode('forgot')">Yeni kod iste</a>`}</p></form></div>`
}
async function resetSubmit(){
const f=Object.fromEntries(new FormData($("#rf")))
rEmail=f.email||""
try{
if(mode=="forgot"){await api("/forgot",{method:"POST",body:{email:f.email}});err="";mode="reset";toast("Kod oluşturuldu, sunucu yöneticisinden iste","ok",6000);resetView()}
else{await api("/reset",{method:"POST",body:{email:f.email,code:f.code,password:f.password}});err="";mode="login";toast("Şifren değiştirildi, giriş yapabilirsin","ok");authView()}
}catch(e){err=e.message;resetView()}
}
function authView(){
if(mode=="forgot"||mode=="reset")return resetView()
if(mode=="guest")return guestView()
const l=mode=="login"
$("#app").innerHTML=`<div class="auth"><div class="hero"><div class="logo big"><span>📖</span><b>Dijital Okul</b></div><h1>Kitapların tabletinde, el yazın kalemde.</h1><p>PDF üzerine yaz, ödevini teslim et, canlı derse kodla katıl.</p></div>
<form id="af" class="panel" onsubmit="auth();return false"><h2>${l?"Giriş yap":"Kayıt ol"}</h2>
${l?"":`<label>Ad<input name="name" required></label>`}
<label>E-posta<input name="email" type="email" required></label>
<label>Şifre<input name="password" type="password" required minlength="6"></label>
${l?"":`<label>Rol<select name="role"><option value="student">Öğrenci</option><option value="teacher">Öğretmen</option><option value="parent">Veli</option></select></label><label>Veli kodu (yalnızca veli için)<input name="code" placeholder="Öğrencinden aldığın kod"></label>`}
<div class="err">${esc(err)}</div>
<button class="btn lg">${l?"Giriş yap":"Hesap oluştur"}</button>
<p class="sw2">${l?`Hesabın yok mu? <a onclick="setMode('reg')">Kayıt ol</a> · <a onclick="setMode('forgot')">Şifremi unuttum</a>`:`Zaten hesabın var mı? <a onclick="setMode('login')">Giriş yap</a>`}</p><p class="sw2"><a onclick="setMode('guest')">Misafir olarak katıl (kodla)</a></p></form></div>`
}

const bs=await api("/books?search="+encodeURIComponent(search))
cache(bs)
$("#app").innerHTML=`<div class="hd"><h1>Kitaplık</h1><div class="row"><input id="sq" class="srch" placeholder="Kitaplarda ara…" value="${esc(search)}" onkeydown="if(event.key=='Enter')libView(this.value)">${me.role=="teacher"?`<label class="chk"><input type="checkbox" id="us"> Herkesle paylaş</label>`:""}<input id="up" type="file" accept="application/pdf" hidden onchange="upload()"><input id="upi" type="file" accept="image/*" multiple hidden onchange="uploadImgs()"><input id="upv" type="file" accept="video/*" hidden onchange="uploadVideo()"><button class="btn sec" onclick="$('#upi').click()">🖼 Resimlerden kitap</button><label class="chk"><input type="checkbox" id="vsp" checked> Sayfaları tek tek ayır</label><button class="btn sec" onclick="$('#upv').click()">🎬 Videodan kitap</button><button class="btn sec" onclick="pdfLink()">🔗 PDF linkinden</button><button class="btn" onclick="$('#up').click()">＋ PDF yükle</button></div></div>

let vidJobs=[]
async function uploadVideo(){
const f=$("#upv").files[0]
$("#upv").value=""
if(!f)return
const fd=new FormData()
fd.append("file",f)
fd.append("title",f.name.replace(/\.[^.]+$/,""))
if($("#us")&&$("#us").checked)fd.append("shared",1)
fd.append("split",$("#vsp")&&$("#vsp").checked?1:0)
try{const r=await api("/books/video",{method:"POST",body:fd});vidJobs.push(r.job);toast("Video yüklendi, sayfalar ayıklanıyor. Başka işine devam edebilirsin.","ok",6000)}catch(e){toast(e.message,"bad",8000)}
}
setInterval(async()=>{
for(const id of[...vidJobs]){
let r
try{r=await api("/ai/jobs/"+id)}catch(e){vidJobs=vidJobs.filter(x=>x!==id);toast(e.message,"bad",7000);continue}
if(r.status=="running")continue
vidJobs=vidJobs.filter(x=>x!==id)
if(r.status=="done"){toast("Videodan kitap hazır · "+r.pages+" sayfa","ok",7000);if(view=="lib")libView()}
else toast(r.error,"bad",9000)
}
},3000)
async function pdfLink(){
const link=prompt("PDF bağlantısı (kullanım izni olduğun bir dosya):")
if(!link)return
const fd=new FormData()
fd.append("url",link)
fd.append("title","")
if($("#us")&&$("#us").checked)fd.append("shared",1)
const t=toast("PDF indiriliyor…","",0)
try{const r=await api("/books/url",{method:"POST",body:fd});toast("Kitap eklendi · "+r.pages+" sayfa","ok");if(view=="lib")libView()}catch(e){toast(e.message,"bad",7000)}
t.remove()
}
async function uploadImgs(){
const fs=[...$("#upi").files]
$("#upi").value=""
if(!fs.length)return
fs.sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}))
const fd=new FormData()
fs.forEach(f=>fd.append("files",f))
fd.append("title",fs[0].name.replace(/\.[^.]+$/,"").replace(/[-_ ]*\d+$/,"")||"Kitap")
if($("#us")&&$("#us").checked)fd.append("shared",1)
const t=toast(fs.length+" resim birleştirilip kitaba çevriliyor…","",0)
try{const r=await api("/books/images",{method:"POST",body:fd});toast("Kitap eklendi · "+r.pages+" sayfa","ok")}catch(e){toast(e.message,"bad",7000)}
t.remove()
}
async function upload(){
const f=$("#up").files[0]
if(!f)return
const fd=new FormData()
fd.append("file",f);fd.append("title",f.name.replace(/\.pdf$/i,""))
if($("#us")&&$("#us").checked)fd.append("shared",1)
const t=toast("Yükleniyor, metin çıkarılıyor…","",0)
try{await api("/books",{method:"POST",body:fd});toast("Kitap eklendi","ok")}catch(e){toast(e.message,"bad")}
t.remove()
libView()
}

if(on&&!t){try{t=(await navigator.mediaDevices.getUserMedia({[kind]:true})).getTracks()[0];local.addTrack(t)}catch(e){toast((kind=="audio"?"Mikrofon":"Kamera")+" açılamadı: "+e.message,"bad");t=null}}

}

}
}

function setBTool(t){btool=t;$("#lpen").classList.toggle("on",t=="pen");$("#ler").classList.toggle("on",t=="eraser")}
function bstroke(s){
bx.lineCap=bx.lineJoin="round";bx.strokeStyle=s.c;bx.lineWidth=s.w
bx.beginPath()
s.p.forEach(([x,y],i)=>i?bx.lineTo(x,y):bx.moveTo(x,y))
if(s.p.length==1)bx.lineTo(s.p[0][0]+.01,s.p[0][1])
bx.stroke()
}
function bredraw(){bx.fillStyle="#fff";bx.fillRect(0,0,1280,720);ls.forEach(bstroke)}
function bpt(e){
const r=bc.getBoundingClientRect()
return[Math.round((e.clientX-r.left)*1280/r.width),Math.round((e.clientY-r.top)*720/r.height)]
}
function flush(){
lt=null
if(lc&&lbuf.length){send({t:"draw",k:lc.k,c:lc.c,w:lc.w,p:lbuf});lbuf=[]}
}
bc.addEventListener("pointerdown",e=>{
if(!canWrite())return
bc.setPointerCapture(e.pointerId)
const er=btool=="eraser",p=e.pressure>0?e.pressure:.5
lc={k:myId+"-"+(++ln),c:er?"#ffffff":$("#bcol").value,w:+$("#bsz").value*(.5+p)*(er?4:1),p:[bpt(e)]}
ls.push(lc);li[lc.k]=lc;lbuf=[lc.p[0]];bredraw();flush()
})
bc.addEventListener("pointermove",e=>{
if(lc){const p=bpt(e);lc.p.push(p);lbuf.push(p);bredraw();if(!lt)lt=setTimeout(flush,30)}
})
const bstop=()=>{if(lc){flush();lc=null}}
bc.addEventListener("pointerup",bstop)
bc.addEventListener("pointercancel",bstop)
function bundo(){
if(canWrite()){const s=ls.pop();if(s)delete li[s.k];bredraw();send({t:"undo"})}
}
function bclear(){
if(canWrite()&&confirm("Tahta temizlensin mi?")){ls=[];li={};bredraw();send({t:"clear"})}
}

async function csvStu(inp){
const f=inp.files[0]
inp.value=""
if(!f)return
const text=await f.text()
const satir=text.split(/\r?\n/).map(x=>x.replace(/;/g,",").trim()).filter(x=>x.includes("@"))
if(!satir.length)return toast("CSV'de e-posta içeren satır bulunamadı","bad")
$("#stx").value=satir.join("\n")
addStu()
}

/* ---------- sınav listesi ---------- */
function exCard(e,t){
const a=e.attempt,self=e.scope=="self",b=[]
if(t)b.push(e.state=="upcoming"?`<button class="btn sm" onclick="openNow(${e.id})">▶ Şimdi başlat</button>`:"",`<button class="btn sm" onclick="exmReport(${e.id})">📊 Rapor</button>`,`<button class="btn sec sm" onclick="pairsView(${e.id})">🔎 Örüntü</button>`,`<button class="btn dn sm" onclick="delExam(${e.id})">Sil</button>`)
else{
if(a&&a.status=="bitti")b.push(`<button class="btn sec sm" onclick="examResult(${a.id})">Sonucum${self?` (${a.score})`:""}</button>`)
if(e.state=="open"&&(self||!a||a.status=="devam"))b.push(`<button class="btn sm" onclick="examStart(${e.id})">${a&&a.status=="devam"?"Devam et":a?"Tekrar çöz":"Başla"}</button>`)
if(self)b.push(`<button class="btn dn sm" onclick="delExam(${e.id})">Sil</button>`)
}
const when=(self?"":`${fdt(e.start_at)} → ${fdt(e.end_at)} · `)+`${e.nq} soru${e.duration?` · ${e.duration} dk`:""}`
return `<div class="card"><div class="row"><b class="grow">${esc(e.title)}</b><span class="tag">${KIND[e.kind]}</span>${self?`<span class="tag">Kendi testim</span>`:schip(e.state)}</div><small>${e.cname?esc(e.cname)+" · ":""}${!t&&e.teacher&&!self?esc(e.teacher)+" · ":""}${when}${t?` · ${e.na} giriş`:""}</small>${t&&e.guests&&e.code?`<p class="mu">Misafir kodu: <button class="chip big" onclick="copy('${e.code}')">${e.code}</button></p>`:""}<div class="row" style="margin-top:10px">${b.join("")}</div></div>`
}
async function exmView(){
clearTimeout(exmT)
view="exm";nav()
const t=me.role=="teacher",g=me.role=="guest"
const r=await api("/exams"),off=r.now*1000-Date.now(),ex=r.exams
const sc=ex.filter(e=>e.scope!="self"),sf=ex.filter(e=>e.scope=="self")
$("#app").innerHTML=`<div id="xlist">${ed?`<div class="card row"><div class="grow"><b>Hazırladığın sınav taslağı duruyor</b></div><button class="btn sm" onclick="edView()">Taslağa dön</button></div>`:""}<div class="hd"><h1>Sınavlar</h1><div class="row">${g?"":`<button class="btn" onclick="newExam()">${t?"＋ Yeni sınav / deneme":"＋ Kendi testimi hazırla"}</button>`}</div></div>

${sc.length?`<h3 class="sh2">${t?"Sınavlarım":"Sınıf sınavları"}</h3>`+sc.map(e=>exCard(e,t)).join(""):`<div class="empty">🧪<p>${t?"Henüz sınav yok.":"Şu an görünen sınav yok."}</p></div>`}
${sf.length?`<h3 class="sh2">Kendi testlerim</h3>`+sf.map(e=>exCard(e,t)).join(""):""}</div>`
const nx=ex.flatMap(e=>e.scope=="self"?[]:[e.start_at,e.end_at]).filter(x=>x*1000>Date.now()+off).sort((a,b)=>a-b)[0]

function edRender(){
$("#qh").textContent=`Sorular (${ed.qs.length})`
$("#edq").innerHTML=ed.qs.map((x,i)=>`<div class="card"><div class="row"><b>Soru ${i+1}</b>${x.ai?`<span class="tag">YZ</span>`:""}<input class="grow" placeholder="Konu (isteğe bağlı)" value="${esc(x.topic)}" oninput="ed.qs[${i}].topic=this.value"><button class="ic" onclick="edDel(${i})" title="Sil">🗑</button></div><textarea style="width:100%;margin:8px 0" oninput="ed.qs[${i}].text=this.value">${esc(x.text)}</textarea>${x.opts.map((o,j)=>`<div class="row" style="margin-top:6px"><input type="radio" name="r${i}" ${x.ans==j?"checked":""} onchange="ed.qs[${i}].ans=${j}" title="Doğru cevap"><b>${"ABCDE"[j]}</b><input class="grow" value="${esc(o)}" oninput="ed.qs[${i}].opts[${j}]=this.value"></div>`).join("")}<input style="width:100%;margin-top:8px" placeholder="Açıklama (isteğe bağlı)" value="${esc(x.expl)}" oninput="ed.qs[${i}].expl=this.value"></div>`).join("")||`<div class="empty">📝<p>Henüz soru yok. Yapay zeka ile üret ya da elle ekle.</p></div>`
}
async function poolPick(){
let rows
try{rows=await api("/pool")}catch(e){return toast(e.message,"bad")}
$("#pick").innerHTML=`<div class="card pk"><h3>Soru havuzu (${rows.length})</h3>${rows.map(x=>`<label class="li"><input type="checkbox" value="${x.id}" class="pchk"><div class="grow"><b>${esc(x.text).slice(0,120)}</b><small>${x.topic?esc(x.topic):"Konusuz"}</small></div></label>`).join("")||`<p class="mu">Havuz boş. Sınav hazırlarken "Havuza kaydet" ile soru ekleyebilirsin.</p>`}<div class="row"><button class="btn" onclick="poolAdd()">Seçilenleri ekle</button><button class="btn sec" onclick="$('#pick').hidden=true">Kapat</button></div></div>`
$("#pick").hidden=false
window._pool=rows
}
function poolAdd(){
const ids=[...document.querySelectorAll(".pchk:checked")].map(x=>+x.value)
const picked=(window._pool||[]).filter(x=>ids.includes(x.id))
if(!picked.length)return toast("En az bir soru seç","bad")
picked.forEach(x=>ed.qs.push({text:x.text,opts:[...x.opts],ans:x.ans,expl:x.expl||"",topic:x.topic||""}))
$("#pick").hidden=true
edRender()
toast(picked.length+" soru havuzdan eklendi","ok")
}
async function poolSaveDraft(){
const qs=ed.qs.filter(x=>x.text.trim()&&x.opts.every(o=>o.trim())&&x.ans>=0)
if(!qs.length)return toast("Kaydedilecek tam soru yok (metin, şıklar ve doğru cevap gerekli)","bad")
try{const r=await api("/pool",{method:"POST",body:{questions:qs.map(({text,opts,ans,expl,topic})=>({text,opts,ans,expl:expl||"",topic:topic||""}))}});toast(r.added+" soru havuza kaydedildi","ok")}catch(e){toast(e.message,"bad")}
}
function edAdd(){ed.qs.push({text:"",opts:["","","",""],ans:-1,expl:"",topic:""});edRender();window.scrollTo(0,document.body.scrollHeight)}
function edDel(i){ed.qs.splice(i,1);edRender()}
function edCancel(){if(ed.qs.length&&!confirm("Hazırladığın sorular silinecek. Çıkılsın mı?"))return;ed=null;exmView()}
async function edSave(){
const e=ed,t=me.role=="teacher"
if(!e.title.trim())return toast("Başlık yaz","bad")
if(!e.qs.length)return toast("En az bir soru ekle","bad")
const bad=e.qs.findIndex(x=>!x.text.trim()||x.opts.some(o=>!o.trim())||x.ans<0)
if(bad>=0)return toast(`${bad+1}. soruda boş alan veya doğru cevap seçilmemiş`,"bad")
const body={title:e.title,kind:e.kind,duration:e.dur||0,shuffle:e.shuffle,source:e.qs.some(x=>x.ai)?"ai":"manual",questions:e.qs.map(({text,opts,ans,expl,topic})=>({text,opts,ans,expl,topic}))}
if(t){
const s=new Date(e.start).getTime()/1000,n=new Date(e.end).getTime()/1000
if(!(s>0)||!(n>s))return toast("Başlangıç ve bitiş saatini kontrol et","bad")
Object.assign(body,{class_id:+e.class_id||null,start_at:s,end_at:n,guests:e.guests})
if(e.priv)Object.assign(body,{private:1,students:[e.priv]})
}
try{
const r=await api("/exams",{method:"POST",body})
ed=null
if(t){toast("Sınav kaydedildi"+(r.code&&e.guests?" · misafir kodu: "+r.code:""),"ok",6000);exmView()}
else{toast("Test hazır","ok");examStart(r.id)}
}catch(x){toast(x.message,"bad",6000)}
}

/* ---------- sınav çözme + ekran değişimi takibi ---------- */
async function examStart(eid){
let r
try{r=await api(`/exams/${eid}/start`,{method:"POST"})}catch(e){return toast(e.message,"bad",5000)}
tk={aid:r.aid,title:r.title,qs:r.qs,a:r.answers||{},dl:r.deadline*1000,off:r.now*1000-Date.now(),away:r.switches||0,fin:0,retry:0}
awayNow=false
view="exm";nav()
tkDraw()
clearInterval(tkTimer);tkTimer=setInterval(tkTick,500);tkTick()
$("#exam").hidden=false
}
function tkDraw(){
$("#exam").innerHTML=`<header class="exh"><b class="grow" style="font-size:17px">${esc(tk.title)}</b><span id="eaway" class="chip" hidden></span><span id="eprog" class="mu"></span><span id="etimer" class="chip big" style="letter-spacing:1px">--:--</span><button class="btn" onclick="examFinish()">Bitir</button></header>
<div id="eban" class="eban" hidden></div>
<div class="exb">${tk.qs.map((q,i)=>`<div class="card"><b>${i+1}.</b> <span class="pre">${esc(q.text)}</span>${q.opts.map((o,j)=>`<label class="opt ${tk.a[q.id]===j?"on":""}" data-q="${q.id}" data-j="${j}" onclick="pick(${q.id},${j})"><b>${"ABCDE"[j]}</b><span>${esc(o)}</span></label>`).join("")}</div>`).join("")}<div class="row" style="justify-content:center;margin:20px 0"><button class="btn lg" onclick="examFinish()">Sınavı bitir</button></div></div>`
tkProg();tkAway()
}
function pick(qid,j){
if(!tk||tk.fin)return
tk.a[qid]=j
$$(`#exam .opt[data-q="${qid}"]`).forEach(l=>l.classList.toggle("on",+l.dataset.j==j))
tkProg()
clearTimeout(tk.st);tk.st=setTimeout(tkSave,350)
}
async function tkSave(){
if(!tk||tk.fin)return
try{await api(`/attempts/${tk.aid}/answers`,{method:"PUT",body:{answers:tk.a}})}catch(e){if(/Süre|kapandı/.test(e.message))examFinish(true)}
}
const tkProg=()=>{const e=$("#eprog");if(e&&tk)e.textContent=`${Object.keys(tk.a).length}/${tk.qs.length} cevaplandı`}
function tkAway(){
const b=$("#eaway")
if(b&&tk){b.hidden=!tk.away;b.textContent=`⚠️ Ekran değişimi: ${tk.away}`}
}
function tkTick(){
if(!tk)return
const left=Math.max(0,Math.floor((tk.dl-(Date.now()+tk.off))/1000))
const h=Math.floor(left/3600),m=Math.floor(left%3600/60),s=left%60,el=$("#etimer")
if(el){el.textContent=(h?h+":":"")+p2(m)+":"+p2(s);el.style.color=left<60?"var(--dn)":""}
if(left<=0&&!tk.fin&&Date.now()>tk.retry)examFinish(true)
}
function tkEv(k){
if(!tk)return
fetch(`/api/attempts/${tk.aid}/event`,{method:"POST",keepalive:true,headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({k})}).catch(()=>{})
}
function goAway(){
if(!tk||awayNow||tk.fin)return
awayNow=true;tk.away++;tkAway();tkEv("away")
}
function comeBack(){
if(!tk||!awayNow)return
awayNow=false;tkEv("back")
const b=$("#eban")
if(b){b.hidden=false;b.textContent=`Sınav ekranından ayrıldığın kaydedildi (toplam ${tk.away} kez). Bu bilgi öğretmenine rapor olarak gider.`}
}
document.addEventListener("visibilitychange",()=>document.hidden?goAway():comeBack())
window.addEventListener("blur",()=>setTimeout(()=>{if(tk&&!document.hasFocus())goAway()},500))
window.addEventListener("focus",()=>{if(!document.hidden)comeBack()})
window.addEventListener("pagehide",goAway)
document.addEventListener("copy",()=>{if(tk)tkEv("copy")})
window.addEventListener("beforeunload",e=>{if(tk&&!tk.fin){e.preventDefault();e.returnValue=""}})
async function examFinish(auto){
if(!tk||tk.fin)return
const un=tk.qs.length-Object.keys(tk.a).length
if(!auto&&!confirm(un?`${un} soru boş. Sınavı bitirmek istiyor musun?`:"Sınavı bitirmek istiyor musun?"))return
tk.fin=1
let r
try{r=await api(`/attempts/${tk.aid}/finish`,{method:"POST",body:{answers:tk.a}})}catch(e){tk.fin=0;tk.retry=Date.now()+3000;toast(e.message,"bad");return}
clearInterval(tkTimer);clearTimeout(tk.st)
tk=null;$("#exam").hidden=true;$("#exam").innerHTML=""
if(auto)toast("Süre doldu, sınav kapandı")
showResult(r)
}
async function examResult(aid){
try{showResult(await api("/attempts/"+aid))}catch(e){toast(e.message,"bad")}
}
function topicSummary(rv){
if(!rv)return ""
const tt={}
rv.forEach(x=>{if(!x.topic)return;const t=tt[x.topic]||(tt[x.topic]={ok:0,n:0});t.n++;if(x.mine===x.ans)t.ok++})
const rows=Object.entries(tt).map(([k,v])=>({topic:k,ok:v.ok,n:v.n,rate:Math.round(100*v.ok/v.n)})).sort((a,b)=>a.rate-b.rate)
if(!rows.length)return ""
const weak=rows.filter(x=>x.rate<50)
return `<div class="card"><h3>Konu özeti</h3>${rows.map(x=>`<div class="row" style="margin:5px 0"><span style="width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.topic)}</span><div class="bar grow"><i style="width:${x.rate}%"></i></div><b style="width:80px;text-align:right">%${x.rate} <small>(${x.ok}/${x.n})</small></b></div>`).join("")}${weak.length?`<p class="mu" style="margin-top:10px">Tekrar önerisi: <b>${weak.map(x=>esc(x.topic)).join(", ")}</b> konularını tekrar çalışmanı öneririm. Yanlış cevapladığın soruların açıklamalarını aşağıda inceleyebilirsin.</p>`:`<p class="mu" style="margin-top:10px">Tüm konularda iyi bir sonuç var. Yanlış cevapladıklarını aşağıdaki açıklamalardan inceleyebilirsin.</p>`}</div>`
}
function showResult(r){
view="exm";nav()
const rv=r.review,self=r.exam.scope=="self"
const weak=rv?[...new Set(rv.filter(x=>x.mine!==x.ans).map(x=>x.topic).filter(Boolean))]:[]
$("#app").innerHTML=`<div class="hd"><div class="row"><button class="btn sec sm" onclick="exmView()">← Sınavlar</button><h1>${esc(r.exam.title)}</h1></div></div>
<div class="card center"><div class="score">${r.score}</div><p class="mu">/ 100</p><div class="row cj"><span class="chip up">✓ ${r.correct} doğru</span><span class="chip dw">✗ ${r.wrong} yanlış</span><span class="chip">– ${r.blank} boş</span></div>
${r.prev?`<p>Önceki (<b>${esc(r.prev.title)}</b>): ${r.prev.score} → şimdi ${r.score} ${dlt(r.score-r.prev.score)}</p>`:`<p class="mu">Karşılaştırılacak önceki sınav yok.</p>`}
${r.rank?`<p>Sıran: <b>${r.rank}</b> / ${r.n}</p>`:self?"":`<p class="mu">Sıralama ve cevap anahtarı sınav kapandıktan sonra açılır.</p>`}
<small>Sınav sırasında ekran değiştirme: ${r.switches} kez</small></div>
${topicSummary(rv)}
${weak.length?`<div class="card"><h3>Tekrar etmen gereken konular</h3><p>${weak.map(w=>`<span class="chip">${esc(w)}</span>`).join(" ")}</p></div>`:""}
${rv?`<h3 class="sh2">Cevap anahtarı</h3>${rv.map((x,i)=>`<div class="card"><b>${i+1}.</b> <span class="pre">${esc(x.text)}</span>${x.opts.map((o,j)=>`<div class="opt ${j==x.ans?"ok":j==x.mine?"bad":""}"><b>${"ABCDE"[j]}</b><span class="grow">${esc(o)}</span>${j==x.ans?"✓":j==x.mine?"✗ senin cevabın":""}</div>`).join("")}${x.mine==null||x.mine<0?`<small>Boş bıraktın.</small>`:""}${x.expl?`<p class="mu">💡 ${esc(x.expl)}</p>`:""}</div>`).join("")}`:""}`
}

/* ---------- öğretmen: sınav raporu ---------- */
function evHtml(a){
const ev=a.events||[]
if(!ev.length)return `<span class="mu">Sınav boyunca sayfadan ayrılma kaydı yok.</span>`
return `<p class="mu">Başlangıç: ${new Date(a.started*1000).toLocaleTimeString("tr-TR")}. “Ekran değişimi” sekme değiştirme, pencereden çıkma ya da sayfayı kapatma demektir; tek başına kopya kanıtı değildir (ör. gelen bir bildirim de odağı alabilir).</p>`+ev.map(e=>{
const tm=new Date(e.at*1000).toLocaleTimeString("tr-TR"),rel="+"+dur(Math.max(0,Math.round(e.at-a.started)))
return `<div>${e.k=="away"?"🚪 Ayrıldı":e.k=="back"?`↩ Döndü (${dur(e.d)} dışarıda)`:"📋 Kopyalama denemesi"} <small style="display:inline">${tm} · ${rel}</small></div>`
}).join("")
}
const evOpen=i=>{const e=$("#ev"+i);e.hidden=!e.hidden}
async function exmReport(eid){
let r
try{r=await api(`/exams/${eid}/report`)}catch(e){return toast(e.message,"bad")}
rp=r;view="exm";nav()
const x=r.exam,done=r.rows.filter(a=>a.status=="bitti").length
$("#app").innerHTML=`<div class="hd"><div class="row"><button class="btn sec sm" onclick="exmView()">← Sınavlar</button><h1>📊 ${esc(x.title)}</h1>${schip(x.state)}</div><div class="row"><button class="btn sec" onclick="csvRep()">⬇ CSV</button>${x.class_id?`<button class="btn sec" onclick="pushGrades(${eid})">📒 Notlara aktar</button>`:""}<button class="btn sec" onclick="exmReport(${eid})">↻ Yenile</button></div></div>
<p class="mu">${fdt(x.start_at)} → ${fdt(x.end_at)} · ${x.nq} soru${x.duration?` · ${x.duration} dk`:""}${x.state!="closed"?" · <b>Sınav henüz kapanmadı; sonuçlar kesinleşmedi.</b>":""}</p>
<div class="stats"><div class="stat"><span>👥</span><b>${done}${r.total?`/${r.total}`:""}</b><small>Tamamlayan</small></div><div class="stat"><span>📊</span><b>${r.avg??"–"}</b><small>Ortalama${r.prev&&r.prev.avg!=null?` (önceki: ${r.prev.avg}) ${r.avg!=null?dlt(r.avg-r.prev.avg):""}`:""}</small></div><div class="stat"><span>🏆</span><b>${r.max??"–"}</b><small>En yüksek</small></div><div class="stat"><span>📉</span><b>${r.min??"–"}</b><small>En düşük</small></div></div>
<div class="card tw"><table class="tbl"><tr><th>Sıra</th><th>Öğrenci</th><th>Doğru</th><th>Yanlış</th><th>Boş</th><th>Puan</th><th>Önceki</th><th>Fark</th><th>Ekran değ.</th><th>Dışarıda</th><th>Süre</th><th></th></tr>${r.rows.map((a,i)=>`<tr><td>${a.rank??"…"}</td><td><b>${esc(a.name)}</b></td><td class="up">${a.correct}</td><td class="dw">${a.wrong}</td><td>${a.blank}</td><td><b>${a.status=="bitti"?a.score:"devam"}</b></td><td>${a.prev?a.prev.score:"–"}</td><td>${a.prev&&a.status=="bitti"?dlt(a.score-a.prev.score):""}</td><td>${a.switches?`<b class="${a.switches>=3?"dw":""}">${a.switches}</b>`:"0"}${a.copies?` <small style="display:inline">📋${a.copies}</small>`:""}</td><td>${a.away_sec?dur(a.away_sec):"–"}</td><td>${dur(a.secs)}</td><td><button class="btn sec sm" onclick="evOpen(${i})">Hareketler</button></td></tr><tr id="ev${i}" hidden><td colspan="12"><div class="sub">${evHtml(a)}</div></td></tr>`).join("")||`<tr><td colspan="12" class="mu">Henüz giren yok.</td></tr>`}</table></div>
${r.absent.length?`<div class="card"><h3>Girmeyenler (${r.absent.length})</h3><p>${r.absent.map(n=>`<span class="chip">${esc(n)}</span>`).join(" ")}</p></div>`:""}
<h3 class="sh2">Soru analizi</h3>${r.qa.map(q=>`<div class="card"><div class="row"><b class="grow">${q.idx}. ${esc(q.text)}</b>${q.topic?`<span class="tag">${esc(q.topic)}</span>`:""}<b>${q.rate==null?"–":"%"+q.rate}</b></div><div class="bar" style="margin:8px 0"><i style="width:${q.rate||0}%"></i></div><small>${q.opts.map((o,j)=>`${"ABCDE"[j]}: ${q.cnt[j]}${j==q.ans?" ✓":""}`).join(" · ")} · boş: ${q.blank}</small></div>`).join("")}`
}
async function pushGrades(eid){
if(!confirm("Bu sınavın puanları sınıfın not defterine (yazılı/deneme) eklensin mi? Daha önce aktardıysan yenilenir."))return
try{const r=await api(`/exams/${eid}/grades`,{method:"POST"});toast(r.n+" not aktarıldı","ok")}catch(e){toast(e.message,"bad")}
}
function csvRep(){
const r=rp,c=v=>typeof v=="string"&&/^[=+\-@]/.test(v)?"'"+v:v
const rows=[["Sıra","Öğrenci","Doğru","Yanlış","Boş","Puan","Önceki puan","Fark","Ekran değişimi","Dışarıda (sn)","Süre (sn)"],...r.rows.map(a=>[a.rank||"",c(a.name),a.correct,a.wrong,a.blank,a.status=="bitti"?a.score:"devam",a.prev?a.prev.score:"",a.prev&&a.status=="bitti"?+(a.score-a.prev.score).toFixed(1):"",a.switches,a.away_sec,a.secs??""])]
const csv="\ufeff"+rows.map(x=>x.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(";")).join("\r\n")
const u=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}))
const a=document.createElement("a");a.href=u;a.download=r.exam.title.replace(/[^\w\-]+/g,"_")+".csv";a.click()
setTimeout(()=>URL.revokeObjectURL(u),2000)
}

render()
</script>
</body>
</html>
